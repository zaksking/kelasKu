<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm py-3">
    <div class="container">
        <a class="navbar-brand" href="#">KelasKu</a>

        </div>

<!-- JUDUL HALAMAN -->
<section class="py-5 bg-light">
    <div class="container text-center">
        <h2 class="fw-bold">Bagikan Catatanmu</h2>
        <p class="text-muted">Unggah materi terbaikmu dan bantu siswa SMK lainnya.</p>
    </div>
</section>


<!-- FORM UPLOAD -->
<section class="py-4">
    <div class="container">
        <div class="card shadow-sm p-4 mx-auto" style="max-width: 700px;">
            <form>

                <!-- Judul Materi -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Judul Materi *</label>
                    <input type="text" class="form-control" placeholder="Masukkan judul materi" required>
                </div>

                <!-- Deskripsi -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Deskripsi</label>
                    <textarea class="form-control" rows="3" placeholder="Tuliskan deskripsi singkat"></textarea>
                </div>

                <!-- Jurusan -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Pilih Jurusan *</label>
                    <select class="form-select" required>
                        <option selected disabled>Pilih Jurusan</option>
                        <option>TKJ</option>
                        <option>AKL</option>
                        <option>RPL</option>
                        <option>MM</option>
                        <option>TBG</option>
                    </select>
                </div>

                <!-- Mata Pelajaran -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Pilih Mata Pelajaran *</label>
                    <select class="form-select" required>
                        <option selected disabled>Pilih Mapel</option>
                        <option>Matematika</option>
                        <option>Bahasa Indonesia</option>
                        <option>Bahasa Inggris</option>
                        <option>Sejarah</option>
                        <option>Produktif</option>
                    </select>
                </div>

                <!-- Kelas -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Pilih Kelas *</label>
                    <select class="form-select" required>
                        <option selected disabled>Pilih Kelas</option>
                        <option>X</option>
                        <option>XI</option>
                        <option>XII</option>
                    </select>
                </div>

                <!-- Upload File -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Unggah File *</label>
                    <input type="file" class="form-control" required>
                    <small class="text-muted">Format: PDF, PPT, DOC. Maks. ukuran 10MB.</small>
                </div>

                <!-- Tombol -->
                <div class="text-end">
                    <button type="submit" class="btn btn-primary px-4 py-2">Terbitkan</button>
                </div>

            </form>
        </div>
    </div>
</section>
